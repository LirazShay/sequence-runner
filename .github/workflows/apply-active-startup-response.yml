name: Apply active startup response tracking

on:
  push:
    branches:
      - fix/active-startup-response-tracking
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/active-startup-response-tracking

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source patch
        run: |
          node scripts/patch-active-startup-response.mjs
          node scripts/patch-active-startup-diagnostic-version.mjs

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload regression failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: active-startup-regression-failure
          path: |
            test-output.log
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove temporary patch machinery
        run: |
          rm scripts/patch-active-startup-response.mjs
          rm scripts/patch-active-startup-diagnostic-version.mjs
          rm .github/workflows/apply-active-startup-response.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Track active startup responses across wait paths"
          git push origin HEAD:fix/active-startup-response-tracking
