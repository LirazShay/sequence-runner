name: Apply stage 2 skip first message

on:
  push:
    branches:
      - feature/handoff-chat-title-prompt

permissions:
  contents: write

jobs:
  apply-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/handoff-chat-title-prompt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply stage 2 changes
        run: python3 scripts/_stage2_skip_first_message.py

      - name: Regenerate bookmarklet
        run: npm run build:bookmarklet

      - name: Run tests
        run: npm test

      - name: Commit verified stage 2
        run: |
          rm .github/workflows/_stage2-skip-first-message.yml
          rm scripts/_stage2_skip_first_message.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js tests/e2e/core.spec.js tests/e2e/diagnostic.spec.js README.md AGENTS.md .github/workflows/_stage2-skip-first-message.yml scripts/_stage2_skip_first_message.py
          git commit -m "Add skip-first-message start option"
          git push origin HEAD:feature/handoff-chat-title-prompt
