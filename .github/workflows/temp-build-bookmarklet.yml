name: Temporary bookmarklet build

on:
  push:
    branches:
      - fix/wait-for-user-runaway-guard
    paths:
      - .github/workflows/temp-build-bookmarklet.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:bookmarklet
      - name: Verify generated bookmarklet structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('runner.min.js', 'utf8');
          if (!text.startsWith('javascript:')) throw new Error('Missing javascript: prefix');
          if (/\r|\n/.test(text)) throw new Error('Bookmarklet must be one physical line');
          if (!text.includes('3.43')) throw new Error('Expected runner version 3.43');
          const code = text.slice('javascript:'.length).replaceAll('%25', '%');
          new Function(code);
          console.log(`runner.min.js bytes=${Buffer.byteLength(text)} sha256=${require('crypto').createHash('sha256').update(text).digest('hex')}`);
          NODE
      - name: Commit generated bookmarklet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.min.js
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate bookmarklet for v3.43"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
