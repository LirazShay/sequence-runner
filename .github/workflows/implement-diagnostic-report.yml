name: Implement diagnostic report

on:
  push:
    branches:
      - feature/built-in-diagnostic-report

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/built-in-diagnostic-report

      - name: Apply diagnostic patch
        run: |
          python scripts/apply-diagnostic-temp.py
          python scripts/fix-diagnostic-test-temp.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Generate bookmarklet
        run: npm run build:bookmarklet

      - name: Run regression suite
        run: npm test

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js tests/e2e/core.spec.js tests/e2e/diagnostic.spec.js README.md AGENTS.md
          git diff --cached --quiet || git commit -m "Add built-in diagnostic snapshot"
          git push
