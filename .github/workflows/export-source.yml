name: Export Source Workspace

on:
  push:
    branches:
      - feature/pause-resume-runner

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: sequence-runner-source
          path: |
            runner.js
            runner.min.js
            README.md
            AGENTS.md
            package.json
            package-lock.json
            playwright.config.js
            scripts
            tests
          if-no-files-found: error
          retention-days: 1
