name: Apply stage 1 handoff title prompt

on:
  push:
    branches:
      - feature/handoff-chat-title-prompt

permissions:
  contents: write

jobs:
  apply-stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/handoff-chat-title-prompt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply stage 1 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner = Path("runner.js")
          text = runner.read_text(encoding="utf-8")
          old_version = '    const VERSION = "3.26";'
          if old_version not in text:
              raise SystemExit("Expected VERSION 3.26 not found")
          text = text.replace(old_version, '    const VERSION = "3.27";', 1)

          old_block = '        return buildFirstPrompt(\n            "new",\n            prompt,\n            selectedWorkStyle,\n            selectedDecisionMode\n        );'
          new_block = '        const chatTitleInstruction =\n            "שם הצ\'אט: אם מופיע במשימה מספר צ\'אט ברור, שם הצ\'אט צריך להיות \\\"צ\'אט N\\\" לפי אותו מספר. אם אין מספר צ\'אט ברור, תן לצ\'אט שם קצר ותיאורי שמסכם את מה שהצ\'אט הזה מתוכנן לבצע.";\n\n        return buildFirstPrompt(\n            "new",\n            [\n                prompt,\n                "",\n                chatTitleInstruction\n            ].join("\\n"),\n            selectedWorkStyle,\n            selectedDecisionMode\n        );'
          start = text.index('    function buildHandoffPrompt(nextChatPrompt) {')
          end = text.index('    function parseHandoff(text) {', start)
          section = text[start:end]
          if old_block not in section:
              raise SystemExit("buildHandoffPrompt return block not found")
          text = text[:start] + section.replace(old_block, new_block, 1) + text[end:]
          runner.write_text(text, encoding="utf-8")

          handoff = Path("tests/e2e/handoff.spec.js")
          tests = handoff.read_text(encoding="utf-8")
          anchor = '  expect(sent[1]).toContain("[[SEQUENCE_RUNNER_NEW_CHAT]]");\n'
          addition = anchor + '  expect(sent[0]).not.toContain("שם הצ\'אט:");\n  expect(sent[1]).toContain("שם הצ\'אט:");\n  expect(sent[1]).toContain("שם הצ\'אט צריך להיות \\\"צ\'אט N\\\"");\n  expect(sent[1]).toContain("שם קצר ותיאורי שמסכם את מה שהצ\'אט הזה מתוכנן לבצע");\n'
          if anchor not in tests:
              raise SystemExit("handoff test anchor not found")
          handoff.write_text(tests.replace(anchor, addition, 1), encoding="utf-8")

          for file_name in ["tests/e2e/core.spec.js", "tests/e2e/diagnostic.spec.js"]:
              path = Path(file_name)
              value = path.read_text(encoding="utf-8")
              if '"3.26"' not in value:
                  raise SystemExit(f"Expected version assertion not found in {file_name}")
              path.write_text(value.replace('"3.26"', '"3.27"'), encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          anchor = '- The extracted handoff text is treated as a **new task** in the fresh chat: the runner wraps it with the same new-task opening format plus the sequence/completion/handoff contract, so the new chat immediately knows the task and can later emit completion or another handoff correctly.\n'
          addition = anchor + '- That first handoff message also includes a chat-title instruction: when the task contains a clear chat number, use `צ\'אט N` with that number; otherwise use a short descriptive title based on the work the fresh chat is planned to perform. This instruction is added only to chats opened automatically by handoff.\n'
          if anchor not in readme_text:
              raise SystemExit("README handoff anchor not found")
          readme.write_text(readme_text.replace(anchor, addition, 1), encoding="utf-8")
          PY

      - name: Regenerate bookmarklet
        run: npm run build:bookmarklet

      - name: Run tests
        run: npm test

      - name: Commit verified stage 1
        run: |
          rm .github/workflows/_stage1-handoff-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js tests/e2e/handoff.spec.js tests/e2e/core.spec.js tests/e2e/diagnostic.spec.js README.md .github/workflows/_stage1-handoff-title.yml
          git commit -m "Add chat title guidance to handoff prompts"
          git push origin HEAD:feature/handoff-chat-title-prompt
