name: Bootstrap E2E Suite

on:
  push:
    branches:
      - test/mock-chatgpt-e2e-suite

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/mock-chatgpt-e2e-suite

      - name: Make mock composer accept the runner paste path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/mock-chatgpt/mock-chatgpt.js')
          text = path.read_text(encoding='utf-8')
          needle = '''  window.__mockChatGPT = api;\n\n  sendButton.addEventListener("click", sendCurrentMessage);'''
          replacement = '''  window.__mockChatGPT = api;\n\n  composer.addEventListener("paste", (event) => {\n    const text = event.clipboardData?.getData("text/plain");\n    if (typeof text !== "string") {\n      return;\n    }\n\n    event.preventDefault();\n    composer.textContent = text;\n    dispatchComposerInput();\n    record("composer-paste", { length: text.length });\n  });\n\n  sendButton.addEventListener("click", sendCurrentMessage);'''
          if needle not in text:
              raise SystemExit('Mock composer patch point not found.')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Chrome
        run: google-chrome --version

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run full regression suite
        run: npm test

      - name: Commit validated bootstrap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/mock-chatgpt/mock-chatgpt.js package-lock.json
          git diff --cached --quiet || git commit -m "Complete Mock ChatGPT E2E bootstrap"
          git push

# Temporary bootstrap workflow; remove after the suite is green and package-lock.json is committed.
