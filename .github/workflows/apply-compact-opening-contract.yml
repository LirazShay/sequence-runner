name: Apply compact opening contract

on:
  push:
    branches:
      - fix/compact-opening-contract
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/compact-opening-contract' || github.ref == 'refs/heads/fix/compact-opening-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/compact-opening-contract

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Repair temporary patcher syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-compact-opening-contract.mjs')
          text = path.read_text()
          old = 'expect(prompt, `missing semantic topic: ${topic}`).toContain(topic);'
          new = 'expect(prompt, "missing semantic topic: " + topic).toContain(topic);'
          if old not in text:
              raise SystemExit('Expected temporary patcher line not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Apply compact contract
        run: node scripts/apply-compact-opening-contract.mjs

      - name: Rebuild bookmarklet
        run: npm run build:bookmarklet

      - name: Run regression suite
        run: npm test

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-compact-opening-contract.mjs
          rm .github/workflows/apply-compact-opening-contract.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact runner opening contract without semantic loss"
          git push origin HEAD:fix/compact-opening-contract
