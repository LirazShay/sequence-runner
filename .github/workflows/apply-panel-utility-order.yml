name: Apply panel utility order

on:
  push:
    branches:
      - fix/panel-utility-order
    paths:
      - scripts/apply-panel-utility-order.mjs
      - .github/workflows/apply-panel-utility-order.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/panel-utility-order
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: node scripts/apply-panel-utility-order.mjs

      - name: Syntax check
        run: node --check runner.js

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Run regression suite
        run: npm test

      - name: Verify temporary files are not staged as product changes
        run: |
          git diff --exit-code -- scripts/apply-panel-utility-order.mjs .github/workflows/apply-panel-utility-order.yml

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js AGENTS.md README.md tests/e2e
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Order panel controls by user utility"
          git push origin HEAD:fix/panel-utility-order
