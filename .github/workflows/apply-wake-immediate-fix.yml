name: Apply wake immediate fix

on:
  push:
    branches:
      - fix/wake-immediate-during-generation

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wake-immediate-during-generation

      - name: Apply wake fix
        run: python scripts/fix-wake-immediate-temp.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Generate bookmarklet
        run: npm run build:bookmarklet

      - name: Run regression suite
        run: npm test

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js tests/e2e/core.spec.js tests/e2e/wake.spec.js README.md AGENTS.md backlog/004-wake-long-running-response.md backlog/README.md
          git diff --cached --quiet || git commit -m "Fix wake nudge to send during active generation"
          git push
