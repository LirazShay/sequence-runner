name: Fix wake API test isolation

on:
  push:
    branches:
      - chore/wake-default-10m

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/wake-default-10m

      - name: Make wake-focused API tests explicitly postpone split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/e2e/wake.spec.js")
          text = p.read_text(encoding="utf-8")
          old = "  await harness.page.selectOption('[data-input=\"split-after-minutes\"]', \"20\");\n  await harness.page.evaluate(() => window.__sequenceRunner.startExistingContext());"
          new = "  await harness.page.evaluate(() =>\n    window.__sequenceRunner.startExistingContext(\n      \"steady\",\n      \"autonomous\",\n      false,\n      undefined,\n      undefined,\n      20\n    )\n  );"
          count = text.count(old)
          if count != 4:
              raise SystemExit(f"expected 4 wake-test API patterns, found {count}")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Sanity check
        run: |
          npm ci
          npm run check:bookmarklet
          node --check runner.js

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-wake-api-test-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate wake regressions from split timing"
          git push origin HEAD:chore/wake-default-10m
