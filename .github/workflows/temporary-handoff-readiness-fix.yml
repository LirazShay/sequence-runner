name: Temporary handoff readiness fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-handoff-readiness-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runner source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('runner.js')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              'const VERSION = "3.16";',
              'const VERSION = "3.17";',
              1,
          )

          source = source.replace(
              '        NAVIGATION_TIMEOUT_MS: 15000,\n        STABLE_MS: 900,',
              '        NAVIGATION_TIMEOUT_MS: 15000,\n        HANDOFF_MIN_READY_MS: 1000,\n        STABLE_MS: 900,',
              1,
          )

          old = '''    async function openFreshChatForHandoff() {
        const target =
            findNewChatTarget();

        const oldUrl =
            location.href;

        const oldComposer =
            getComposer();

        target.button.click();

        const newUrl = await waitUntil(
            function () {
                return location.href !==
                    oldUrl
                    ? location.href
                    : null;
            },
            CONFIG.NAVIGATION_TIMEOUT_MS,
            50
        );

        if (!newUrl) {
            throw new Error(
                "New Chat navigation did not complete."
            );
        }

        await sleep(150);

        const composer = await waitUntil(
            function () {
                const candidate =
                    getComposer();

                if (
                    !candidate ||
                    !isElementVisible(
                        candidate
                    ) ||
                    getStopButton()
                ) {
                    return null;
                }

                const text = normalizeText(
                    candidate.innerText ||
                    candidate.textContent ||
                    candidate.value ||
                    ""
                );

                return text
                    ? null
                    : candidate;
            },
            CONFIG.NAVIGATION_TIMEOUT_MS,
            50
        );

        if (!composer) {
            throw new Error(
                "The composer for the new chat did not become ready."
            );
        }

        return {
            kind: target.kind,
            project: target.project,
            oldUrl,
            newUrl,
            composerReused:
                composer === oldComposer
        };
    }
'''

          new = '''    async function openFreshChatForHandoff() {
        const target =
            findNewChatTarget();

        const oldUrl =
            location.href;

        const oldComposer =
            getComposer();

        const oldTurnKeys = new Set(
            getTurns()
                .map(getTurnKey)
                .filter(Boolean)
        );

        const navigationStartedAt =
            Date.now();

        target.button.click();

        const newUrl = await waitUntil(
            function () {
                return location.href !==
                    oldUrl
                    ? location.href
                    : null;
            },
            CONFIG.NAVIGATION_TIMEOUT_MS,
            50
        );

        if (!newUrl) {
            throw new Error(
                "New Chat navigation did not complete."
            );
        }

        const remainingMinimumWait =
            CONFIG.HANDOFF_MIN_READY_MS -
            (Date.now() - navigationStartedAt);

        if (remainingMinimumWait > 0) {
            await sleep(
                remainingMinimumWait
            );
        }

        const composer = await waitUntil(
            function () {
                const oldTurnStillVisible =
                    getTurns().some(
                        function (turn) {
                            const key =
                                getTurnKey(turn);

                            return (
                                key &&
                                oldTurnKeys.has(key) &&
                                isElementVisible(turn)
                            );
                        }
                    );

                if (oldTurnStillVisible) {
                    return null;
                }

                const candidate =
                    getComposer();

                if (
                    !candidate ||
                    !isElementVisible(
                        candidate
                    ) ||
                    getStopButton()
                ) {
                    return null;
                }

                const text = normalizeText(
                    candidate.innerText ||
                    candidate.textContent ||
                    candidate.value ||
                    ""
                );

                return text
                    ? null
                    : candidate;
            },
            CONFIG.NAVIGATION_TIMEOUT_MS,
            50
        );

        if (!composer) {
            throw new Error(
                "The old chat did not clear or the new composer did not become ready."
            );
        }

        return {
            kind: target.kind,
            project: target.project,
            oldUrl,
            newUrl,
            composerReused:
                composer === oldComposer
        };
    }
'''

          if old not in source:
              raise SystemExit('Expected openFreshChatForHandoff block was not found')

          if 'HANDOFF_MIN_READY_MS: 1000' not in source:
              raise SystemExit('Failed to add HANDOFF_MIN_READY_MS')

          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate source syntax
        run: node --check runner.js

      - name: Regenerate bookmarklet
        shell: bash
        run: |
          npx --yes terser runner.js --output /tmp/runner.payload.js
          printf 'javascript:' > runner.min.js
          tr -d '\r\n' < /tmp/runner.payload.js >> runner.min.js
          sed 's/^javascript://' runner.min.js > /tmp/runner.check.js
          node --check /tmp/runner.check.js
          test "$(wc -l < runner.min.js)" -eq 0 || test "$(wc -l < runner.min.js)" -eq 1
          grep -q '^javascript:' runner.min.js
          grep -q '3.17' runner.min.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'Sequence Runner Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add runner.js runner.min.js
          git diff --cached --quiet && exit 0
          git commit -m 'Wait for fresh chat before handoff send'
          git push origin HEAD:main
