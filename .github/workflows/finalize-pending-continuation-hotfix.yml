name: Finalize Pending Continuation Hotfix

on:
  push:
    branches:
      - fix/pending-continue-external-turn

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize pending continuation hotfix') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/pending-continue-external-turn

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update documentation
        run: node scripts/finalize-pending-continuation-hotfix.mjs

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run focused stale-continuation regressions
        run: CI= npx playwright test tests/e2e/regressions.spec.js --grep "deferred continuation is superseded|manual turn during continuation delay" --workers=1 --retries=0

      - name: Remove temporary finalizer
        run: |
          rm -f scripts/finalize-pending-continuation-hotfix.mjs
          rm -f .github/workflows/finalize-pending-continuation-hotfix.yml

      - name: Commit finalized hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize pending continuation hotfix"
          git push origin HEAD:fix/pending-continue-external-turn
