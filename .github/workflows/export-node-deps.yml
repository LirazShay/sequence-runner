name: Export Locked Node Dependencies

on:
  push:
    branches:
      - feature/pause-resume-runner
    paths:
      - .github/workflows/export-node-deps.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Upload locked dependencies
        uses: actions/upload-artifact@v4
        with:
          name: sequence-runner-node-modules
          path: node_modules
          if-no-files-found: error
          retention-days: 1
