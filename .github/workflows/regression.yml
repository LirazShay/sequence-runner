name: Regression Suite

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Build bookmarklet artifact
        run: |
          node scripts/build-bookmarklet.mjs
          mkdir -p build-artifacts
          cp runner.min.js build-artifacts/runner.min.js
          git checkout -- runner.min.js

      - name: Upload bookmarklet artifact
        uses: actions/upload-artifact@v4
        with:
          name: sequence-runner-bookmarklet
          path: build-artifacts/runner.min.js
          if-no-files-found: error
          retention-days: 7

      - name: Run regression suite
        run: npm test

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-runner-regression-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
