name: Cleanup Accidental Dependencies

on:
  push:
    branches:
      - fix/pending-continue-external-turn

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/pending-continue-external-turn

      - name: Remove generated dependency artifacts
        run: |
          rm -rf node_modules test-results playwright-report
          cat > .gitignore <<'EOF'
          node_modules/
          test-results/
          playwright-report/
          EOF
          rm -f .github/workflows/cleanup-accidental-dependencies.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove committed dependency artifacts"
          git push origin HEAD:fix/pending-continue-external-turn
