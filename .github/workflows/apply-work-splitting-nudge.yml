name: Apply configurable work splitting nudge

on:
  push:
    branches:
      - feature/configurable-work-splitting-nudge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/configurable-work-splitting-nudge

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply work splitting implementation
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/fix-work-splitting-patcher.mjs
            node scripts/patch-work-splitting-nudge.mjs
            node scripts/patch-work-splitting-support.mjs
            node scripts/fix-work-splitting-tests.mjs
          } 2>&1 | tee work-splitting-apply.log

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee split-test-output.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-splitting-nudge-failure
          path: |
            work-splitting-apply.log
            split-test-output.log
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove temporary patch machinery
        run: |
          rm scripts/fix-work-splitting-patcher.mjs
          rm scripts/patch-work-splitting-nudge.mjs
          rm scripts/patch-work-splitting-support.mjs
          rm scripts/fix-work-splitting-tests.mjs
          rm .github/workflows/apply-work-splitting-nudge.yml
          rm -f work-splitting-apply.log split-test-output.log

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add configurable long-work split escalation"
          git push origin HEAD:feature/configurable-work-splitting-nudge
