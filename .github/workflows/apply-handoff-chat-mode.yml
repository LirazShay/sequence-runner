name: Apply handoff Chat mode guard

on:
  push:
    branches:
      - fix/handoff-force-chat-mode

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/handoff-force-chat-mode

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply changes
        run: |
          python3 scripts/apply-handoff-chat-mode.py
          python3 scripts/fix-runner-version-test-contract.py

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Rebuild bookmarklet
        run: npm run build:bookmarklet

      - name: Run regression suite
        run: npm test

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/apply-handoff-chat-mode.yml
          rm scripts/apply-handoff-chat-mode.py
          rm scripts/fix-runner-version-test-contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ensure automatic handoffs use Chat mode"
          git push origin HEAD:fix/handoff-force-chat-mode
