name: Fix bookmarklet URL safety

on:
  push:
    branches:
      - fix/bookmarklet-url-safety

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/bookmarklet-url-safety

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update source version and permanent instructions
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('runner.js')
          text = runner.read_text(encoding='utf-8')
          old = 'const VERSION = "3.18";'
          new = 'const VERSION = "3.19";'
          if old not in text:
              raise SystemExit('Expected v3.18 VERSION marker was not found.')
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          needle = 'Do not edit it manually.\n\nWhenever `runner.js` changes:'
          insert = '''Do not edit it manually.\n\n`runner.min.js` is a bookmarklet URL, not merely a minified JavaScript file. The JavaScript behavior must remain exactly the same as `runner.js`: minify only, with no hand edits, no logic rewrites and no arbitrary URL encoding. After minification, escape literal percent characters (`%` -> `%25`) only for bookmarklet transport, because browsers may URL-decode sequences such as `%36` and corrupt JavaScript operators such as `value%3600`. A single URL-decode of the text after `javascript:` must reproduce the minified JavaScript payload byte-for-byte.\n\nWhenever `runner.js` changes:'''
          if needle not in text:
              raise SystemExit('AGENTS bookmarklet insertion point was not found.')
          agents.write_text(text.replace(needle, insert, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          needle = 'Whenever it changes, regenerate `runner.min.js` from the same source. The compact file should not be edited independently.'
          insert = '''Whenever it changes, regenerate `runner.min.js` from the same source. The compact file should not be edited independently.\n\nThe distribution file must be directly bookmarklet-safe while preserving the exact minified program. Minify `runner.js` without semantic rewrites, then protect literal percent characters by writing `%25` in the final bookmarklet URL. Do not manually rewrite or broadly re-encode the JavaScript. As a required verification, remove the `javascript:` prefix, URL-decode once, and require the result to be byte-for-byte identical to the freshly generated minified JavaScript payload; syntax-check that decoded payload as JavaScript. This prevents browser URL decoding from corrupting expressions such as the modulo operator in `value%3600`.'''
          if needle not in text:
              raise SystemExit('README bookmarklet insertion point was not found.')
          readme.write_text(text.replace(needle, insert, 1), encoding='utf-8')
          PY

      - name: Minify canonical source only
        run: |
          npx --yes terser@5.44.0 runner.js --compress --mangle --output /tmp/runner.payload.js
          node --check /tmp/runner.payload.js

      - name: Build exact bookmarklet transport
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');

          const payload = fs.readFileSync('/tmp/runner.payload.js', 'utf8').trimEnd();
          assert(payload.length > 0, 'Minified payload is empty.');
          assert(!payload.includes('\n') && !payload.includes('\r'), 'Minified payload must be one physical line.');

          // Transport-only escaping. Do not alter JavaScript semantics.
          const bookmarklet = 'javascript:' + payload.replaceAll('%', '%25');
          fs.writeFileSync('runner.min.js', bookmarklet, 'utf8');

          const stored = fs.readFileSync('runner.min.js', 'utf8');
          assert(stored.startsWith('javascript:'), 'Bookmarklet prefix missing.');
          assert(!stored.includes('\n') && !stored.includes('\r'), 'Bookmarklet must be one physical line.');

          const decoded = decodeURIComponent(stored.slice('javascript:'.length));
          assert.strictEqual(decoded, payload, 'URL-decoded bookmarklet payload differs from minified JavaScript.');
          fs.writeFileSync('/tmp/runner.decoded.js', decoded, 'utf8');
          NODE
          node --check /tmp/runner.decoded.js

      - name: Verify release markers and diff
        run: |
          grep -q 'const VERSION = "3.19";' runner.js
          grep -q '^javascript:' runner.min.js
          grep -q '3.19' runner.min.js
          git diff --check
          git diff --stat

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js AGENTS.md README.md
          git commit -m "Fix bookmarklet URL transport safety"
          git push
