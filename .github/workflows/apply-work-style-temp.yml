name: Temporary Work Style Implementation

on:
  push:
    branches:
      - feature/work-style-flavours

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/work-style-flavours
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make temporary helper state insertion robust
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-work-style-temp.py")
          text = path.read_text(encoding="utf-8")

          label_pos = text.index('"diagnostic/public work-style state"')
          block_start = text.rfind("runner = replace_all_exact(\n", 0, label_pos)
          if block_start < 0:
              raise RuntimeError("Could not locate broad taskMode replacement")

          end_marker = '    "run-started work style",\n)\n\n'
          block_end = text.index(end_marker, label_pos) + len(end_marker)

          replacement = """task_mode_line = "taskMode: selectedTaskMode,"
          task_mode_count = 0
          task_mode_lines = []
          for line in runner.splitlines(keepends=True):
              task_mode_lines.append(line)
              if line.strip() == task_mode_line:
                  indent = line[:len(line) - len(line.lstrip())]
                  task_mode_lines.append(indent + "workStyle: selectedWorkStyle,\\n")
                  task_mode_count += 1

          if task_mode_count != 3:
              raise RuntimeError(
                  f"work-style state insertion: expected 3 taskMode fields, found {task_mode_count}"
              )

          runner = "".join(task_mode_lines)

          """

          text = text[:block_start] + replacement + text[block_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply work-style implementation
        run: python3 scripts/apply-work-style-temp.py

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run regression suite
        run: npm test

      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/workflows/apply-work-style-temp.yml
          rm scripts/apply-work-style-temp.py
          git config user.name "Sequence Runner Bot"
          git config user.email "sequence-runner-bot@users.noreply.github.com"
          git add AGENTS.md README.md runner.js runner.min.js tests/e2e/core.spec.js tests/e2e/diagnostic.spec.js tests/e2e/handoff.spec.js
          git add -u .github/workflows/apply-work-style-temp.yml scripts/apply-work-style-temp.py
          git diff --cached --check
          git commit -m "Add Steady and Deep work styles"
          git push origin HEAD:feature/work-style-flavours
