name: Apply Configurable Wake

on:
  push:
    branches:
      - feature/configurable-long-wait-wake

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply configurable wake changes
        run: node scripts/apply-configurable-wake.mjs

      - name: Update version assertions
        run: |
          sed -i 's/"3\.30"/"3.31"/g' tests/e2e/core.spec.js
          sed -i 's/"3\.30"/"3.31"/g' tests/e2e/diagnostic.spec.js

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run regression suite
        run: npm test

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-configurable-wake.mjs
          rm -f .github/workflows/apply-configurable-wake.yml

      - name: Commit generated change set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Make long-wait wake configurable"
          git push origin HEAD:feature/configurable-long-wait-wake
