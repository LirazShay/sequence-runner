name: Apply latest-turn fix

on:
  push:
    branches:
      - fix-follow-latest-turn

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-follow-latest-turn
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one literal match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          runner = Path('runner.js')
          text = runner.read_text(encoding='utf-8')
          text = text.replace('const VERSION = "3.22";', 'const VERSION = "3.23";', 1)

          pattern = re.compile(
              r'    function findNewTurn\(beforeKeys, expectedPrompt\) \{.*?\n    \}\n\n'
              r'    function resolveCycleTurn\(cycle\) \{.*?\n    \}\n\n'
              r'    function getComposerText',
              re.S,
          )
          replacement = '''    function findNewTurn(beforeKeys) {
              const candidates = getTurns().filter(
                  function (turn) {
                      return !beforeKeys.has(
                          getTurnKey(turn)
                      );
                  }
              );

              return candidates.at(-1) || null;
          }

          function resolveCycleTurn(cycle) {
              const current =
                  getTurnByKey(cycle.turnKey);

              const latestPostSendTurn =
                  findNewTurn(
                      cycle.beforeKeys
                  );

              const resolved =
                  latestPostSendTurn || current;

              if (!resolved) {
                  return null;
              }

              const resolvedKey =
                  getTurnKey(resolved);

              if (
                  resolvedKey &&
                  resolvedKey !== cycle.turnKey
              ) {
                  record("turn-rebound", {
                      id: cycle.id,
                      from: cycle.turnKey,
                      to: resolvedKey,
                      reason: "latest-post-send-turn"
                  });

                  cycle.turnKey = resolvedKey;
              }

              return resolved;
          }

          function getComposerText'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'runner.js: expected one findNewTurn/resolveCycleTurn block, found {count}')
          runner.write_text(text, encoding='utf-8')

          replace_once(
              'AGENTS.md',
              'After sending, process only a new turn created for that sent prompt.',
              'After sending, the newest turn created after that send is authoritative. If the user sends additional messages while ChatGPT is working, follow the newest post-send turn instead of staying pinned to the Runner prompt text.'
          )

          replace_once(
              'README.md',
              '- Only a newly created turn matching the sent user prompt is processed.',
              '- After a Runner send, the newest turn created after that send is the active turn. If the user sends additional messages while ChatGPT is working, the Runner follows the newest post-send turn instead of staying pinned to the original Runner prompt text.'
          )

          mock = Path('tests/mock-chatgpt/mock-chatgpt.js')
          text = mock.read_text(encoding='utf-8')
          old = '''    const chunkDelayMs = Number(response.chunkDelayMs ?? 25);

              if (showStop) {
                beginGeneration();
              }'''
          new = '''    const chunkDelayMs = Number(response.chunkDelayMs ?? 25);

              if (response.replaceActiveGeneration === true) {
                resetGeneration();
                record("generation-replaced-by-latest-turn", {
                  turnKey: turn.getAttribute("data-turn-key")
                });
              }

              if (showStop) {
                beginGeneration();
              }'''
          if old not in text:
              raise SystemExit('mock-chatgpt.js: runNormalResponse insertion point not found')
          text = text.replace(old, new, 1)

          old = '''    if (selected.type === "hold") {
                runHoldResponse(turn, selected);
                return;
              }

              runNormalResponse(turn, selected);'''
          new = '''    if (selected.type === "silent") {
                record("assistant-silent", {
                  turnKey: turn.getAttribute("data-turn-key")
                });
                return;
              }

              if (selected.type === "hold") {
                runHoldResponse(turn, selected);
                return;
              }

              runNormalResponse(turn, selected);'''
          if old not in text:
              raise SystemExit('mock-chatgpt.js: runResponse insertion point not found')
          text = text.replace(old, new, 1)
          mock.write_text(text, encoding='utf-8')

          recovery = Path('tests/e2e/recovery.spec.js')
          text = recovery.read_text(encoding='utf-8')
          test_block = r'''

          test("runner follows the latest post-send turn when the user sends messages while ChatGPT is working", async ({ harness }) => {
            await harness.load();
            await harness.setScenario({
              responses: [
                { type: "hold" },
                { type: "silent" },
                {
                  type: "normal",
                  replaceActiveGeneration: true,
                  text: "Manual messages incorporated.\nסיימתי"
                }
              ]
            });

            await harness.page.evaluate(() => window.__sequenceRunner.startExistingContext());
            await harness.waitForState("GENERATING");

            await harness.page.evaluate(() => {
              window.__mockChatGPT.setComposerText("MANUAL_MESSAGE_ONE");
              document.querySelector('form[data-chatgpt-composer] button[aria-label="Send"]').click();
            });

            await expect.poll(
              () => harness.page.evaluate(() => window.__sequenceRunner.getState().currentCycle?.turnKey)
            ).toBe("mock-turn-2");

            await harness.page.evaluate(() => {
              window.__mockChatGPT.setComposerText("MANUAL_MESSAGE_TWO");
              document.querySelector('form[data-chatgpt-composer] button[aria-label="Send"]').click();
            });

            await expect.poll(
              () => harness.page.evaluate(() => window.__sequenceRunner.getState().currentCycle?.turnKey)
            ).toBe("mock-turn-3");

            await harness.waitForState("DONE");

            expect(await harness.sentMessages()).toHaveLength(3);

            const log = await harness.page.evaluate(() => window.__sequenceRunner.getLog());
            expect(log.some((entry) =>
              entry.event === "turn-rebound" &&
              entry.to === "mock-turn-2" &&
              entry.reason === "latest-post-send-turn"
            )).toBeTruthy();
            expect(log.some((entry) =>
              entry.event === "turn-rebound" &&
              entry.to === "mock-turn-3" &&
              entry.reason === "latest-post-send-turn"
            )).toBeTruthy();
          });
          '''
          if 'runner follows the latest post-send turn when the user sends messages while ChatGPT is working' in text:
              raise SystemExit('recovery.spec.js: regression test already exists')
          recovery.write_text(text.rstrip() + test_block.rstrip() + '\n', encoding='utf-8')

          replace_once('tests/e2e/core.spec.js', 'version: "3.22",', 'version: "3.23",')
          p = Path('tests/e2e/diagnostic.spec.js')
          text = p.read_text(encoding='utf-8')
          count = text.count('"3.22"')
          if count != 2:
              raise SystemExit(f'diagnostic.spec.js: expected two version assertions, found {count}')
          p.write_text(text.replace('"3.22"', '"3.23"'), encoding='utf-8')
          PY

      - run: npm ci
      - run: npm run build:bookmarklet
      - run: npm test

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js AGENTS.md README.md tests/mock-chatgpt/mock-chatgpt.js tests/e2e/recovery.spec.js tests/e2e/core.spec.js tests/e2e/diagnostic.spec.js
          git diff --cached --check
          git commit -m "fix: follow latest post-send turn"
          git push origin HEAD:fix-follow-latest-turn
