name: Temporary Checkpoint Decision Implementation

on:
  push:
    branches:
      - feature/checkpoint-decision-modes

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/checkpoint-decision-modes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply implementation
        run: python3 scripts/apply-checkpoint-decision-temp.py

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run regression suite
        run: npm test

      - name: Commit intended changes and remove temporary helpers
        run: |
          rm .github/workflows/apply-checkpoint-decision-temp.yml
          rm scripts/apply-checkpoint-decision-temp.py
          git config user.name "Sequence Runner Bot"
          git config user.email "sequence-runner-bot@users.noreply.github.com"
          git add AGENTS.md README.md runner.js runner.min.js tests/e2e/core.spec.js tests/e2e/handoff.spec.js tests/e2e/diagnostic.spec.js
          git diff --cached --check
          git commit -m "Add checkpoint and decision modes"
          git push origin HEAD:feature/checkpoint-decision-modes
