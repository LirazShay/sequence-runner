name: Apply Pause Resume

on:
  push:
    branches:
      - feature/pause-resume-runner
    paths:
      - .github/workflows/apply-pause-resume.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pause-resume-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pause-resume-runner
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def replace_timer_before(text, section_marker, action_marker, label):
              section = text.index(section_marker)
              marker = text.index(action_marker, section)
              token = "setTimeout(function () {"
              timer = text.rfind(token, section, marker)
              if timer < 0:
                  raise SystemExit(f"{label}: timer not found")
              replacement = f'scheduleRunnerAction("{label}", function () {{'
              return text[:timer] + replacement + text[timer + len(token):]

          path = Path("runner.js")
          text = path.read_text(encoding="utf-8")

          text = replace_once(text, 'const VERSION = "3.40";', 'const VERSION = "3.41";', "version")
          text = replace_once(text, 'LONG_WAIT_SPLIT_DEFAULT_MINUTES: 10,', 'LONG_WAIT_SPLIT_DEFAULT_MINUTES: 15,', "split default")
          text = replace_once(text, 'ברירת המחדל היא 10 דקות.', 'ברירת המחדל היא 15 דקות.', "split help")

          old_controls = '''        '<button type="button" data-action="resume-run" style="display:none;width:100%;border:1px solid #0891b2;background:#164e63;color:#fff;border-radius:6px;padding:6px;cursor:pointer;margin-bottom:6px;font-weight:700">המשך אוטומציה</button>',
        '<div style="display:flex;gap:6px">','''
          new_controls = '''        '<button type="button" data-action="resume-run" style="display:none;width:100%;border:1px solid #0891b2;background:#164e63;color:#fff;border-radius:6px;padding:6px;cursor:pointer;margin-bottom:6px;font-weight:700">המשך שליחה ממתינה</button>',
        '<button type="button" data-action="toggle-pause" style="display:none;width:100%;border:1px solid #d97706;background:#78350f;color:#fff;border-radius:6px;padding:7px;cursor:pointer;margin-bottom:6px;font-weight:700">⏸ השהה ריצה</button>',
        '<div style="display:flex;gap:6px">','''
          text = replace_once(text, old_controls, new_controls, "pause button")

          text = replace_once(
              text,
              '''    const resumeButton = panel.querySelector('[data-action="resume-run"]');
    const restartButton = panel.querySelector('[data-action="restart-run"]');''',
              '''    const resumeButton = panel.querySelector('[data-action="resume-run"]');
    const pauseButton = panel.querySelector('[data-action="toggle-pause"]');
    const restartButton = panel.querySelector('[data-action="restart-run"]');''',
              "pause button reference"
          )

          text = replace_once(
              text,
              '''    let state = "INIT";
    let stopped = false;
    let observer = null;''',
              '''    let state = "INIT";
    let stopped = false;
    let paused = false;
    let pauseStartedAt = null;
    let totalPausedMs = 0;
    let stateBeforePause = null;
    let pendingPausedAction = null;
    let observer = null;''',
              "pause state"
          )

          helpers = r'''
    function getRunnerRuntimeMs() {
        if (runnerStartedAt == null) {
            return 0;
        }

        const currentPauseMs =
            paused && pauseStartedAt != null
                ? Date.now() - pauseStartedAt
                : 0;

        return Math.max(
            0,
            Date.now() -
                runnerStartedAt -
                totalPausedMs -
                currentPauseMs
        );
    }

    function shiftTimestamp(value, durationMs) {
        return value == null
            ? value
            : value + durationMs;
    }

    function shiftPausedTimers(durationMs) {
        if (durationMs <= 0) {
            return;
        }

        if (currentCycle) {
            currentCycle.sentAt =
                shiftTimestamp(
                    currentCycle.sentAt,
                    durationMs
                );
            currentCycle.deliveryRetryClickedAt =
                shiftTimestamp(
                    currentCycle.deliveryRetryClickedAt,
                    durationMs
                );
            currentCycle.activeGenerationStartedAt =
                shiftTimestamp(
                    currentCycle.activeGenerationStartedAt,
                    durationMs
                );
            currentCycle.wakeThresholdReachedAt =
                shiftTimestamp(
                    currentCycle.wakeThresholdReachedAt,
                    durationMs
                );
        }

        longWorkStartedAt =
            shiftTimestamp(
                longWorkStartedAt,
                durationMs
            );
        splitThresholdReachedAt =
            shiftTimestamp(
                splitThresholdReachedAt,
                durationMs
            );
    }

    function scheduleRunnerAction(
        label,
        callback,
        delayMs
    ) {
        setTimeout(function () {
            if (stopped) {
                return;
            }

            if (paused) {
                if (!pendingPausedAction) {
                    pendingPausedAction = {
                        label,
                        callback,
                        deferredAt: Date.now()
                    };

                    record("pause-action-deferred", {
                        label
                    });
                } else {
                    record("pause-action-collision", {
                        existingLabel:
                            pendingPausedAction.label,
                        ignoredLabel: label
                    });
                }

                renderPanel();
                return;
            }

            callback();
        }, delayMs == null
            ? CONFIG.CONTINUE_DELAY_MS
            : delayMs);
    }

    function pauseRun() {
        if (stopped) {
            throw new Error(
                "Cannot pause a stopped runner."
            );
        }

        if (!runStarted) {
            throw new Error(
                "Start the runner before pausing it."
            );
        }

        if (paused) {
            return false;
        }

        if (
            handoffInProgress ||
            immediateSendLocked
        ) {
            throw new Error(
                "The runner is finishing an atomic send/handoff action. Pause again after it completes."
            );
        }

        stateBeforePause = state;
        paused = true;
        pauseStartedAt = Date.now();

        record("runner-paused", {
            previousState: stateBeforePause,
            currentCycleId:
                currentCycle?.id || null,
            pendingAction:
                pendingPausedAction?.label || null
        });

        setState(
            "PAUSED",
            "⏸ הריצה מושהית. ChatGPT עצמו לא נעצר; לא תישלח פעולה אוטומטית עד להמשך.",
            "#92400e"
        );

        renderPanel();
        return true;
    }

    function resumeRun() {
        if (stopped) {
            throw new Error(
                "Cannot resume a stopped runner."
            );
        }

        if (!paused) {
            return false;
        }

        const resumedAt = Date.now();
        const pausedForMs = Math.max(
            0,
            resumedAt -
                (pauseStartedAt || resumedAt)
        );

        shiftPausedTimers(pausedForMs);
        totalPausedMs += pausedForMs;
        paused = false;
        pauseStartedAt = null;

        const previousState = stateBeforePause;
        stateBeforePause = null;
        const deferredAction =
            pendingPausedAction;
        pendingPausedAction = null;

        record("runner-resumed", {
            pausedForMs,
            previousState,
            deferredAction:
                deferredAction?.label || null
        });

        setState(
            "RESUMING",
            "▶️ הריצה חודשה מאותה נקודה.",
            "#0369a1"
        );

        renderPanel();

        if (deferredAction) {
            record("pause-action-resumed", {
                label: deferredAction.label,
                deferredForMs:
                    Math.max(
                        0,
                        resumedAt -
                            deferredAction.deferredAt
                    )
            });

            deferredAction.callback();
            return true;
        }

        scheduleEvaluate();
        return true;
    }
'''
          text = replace_once(
              text,
              '    function normalizeText(value) {',
              helpers + '\n    function normalizeText(value) {',
              "pause helpers"
          )

          text = replace_once(
              text,
              '''                    : formatDuration(Date.now() - runnerStartedAt)) + '</strong>',''',
              '''                    : formatDuration(getRunnerRuntimeMs())) + '</strong>',''',
              "runtime display"
          )

          text = replace_once(
              text,
              '''            immediateButton.disabled =
                immediateSendLocked || stopped;''',
              '''            immediateButton.disabled =
                immediateSendLocked || stopped || paused;''',
              "disable immediate while paused"
          )

          text = replace_once(
              text,
              '''            resumeButton.disabled =
                pendingAutoSendLocked;''',
              '''            resumeButton.disabled =
                pendingAutoSendLocked || paused;''',
              "disable pending resume while paused"
          )

          pause_render = r'''
        if (pauseButton) {
            pauseButton.style.display =
                runStarted && !stopped
                    ? ""
                    : "none";
            pauseButton.disabled =
                handoffInProgress ||
                immediateSendLocked;
            pauseButton.textContent = paused
                ? "▶ המשך ריצה"
                : "⏸ השהה ריצה";
            pauseButton.style.opacity =
                pauseButton.disabled
                    ? ".55"
                    : "1";
            pauseButton.style.cursor =
                pauseButton.disabled
                    ? "default"
                    : "pointer";
            pauseButton.style.background =
                paused
                    ? "#166534"
                    : "#78350f";
        }

'''
          text = replace_once(
              text,
              '''        const stopButton = panel.querySelector(
            '[data-action="stop"]'
        );''',
              pause_render + '''        const stopButton = panel.querySelector(
            '[data-action="stop"]'
        );''',
              "pause render"
          )

          toggle_listener = r'''
        pauseButton?.addEventListener(
            "click",
            function () {
                try {
                    if (paused) {
                        resumeRun();
                    } else {
                        pauseRun();
                    }
                } catch (err) {
                    updateStatus(
                        "🔴 " + err.message,
                        "#b91c1c"
                    );
                }
            }
        );

'''
          text = replace_once(
              text,
              '''        panel.querySelector(
            '[data-action="stop"]'
        )?.addEventListener(''',
              toggle_listener + '''        panel.querySelector(
            '[data-action="stop"]'
        )?.addEventListener(''',
              "pause listener"
          )

          text = replace_once(
              text,
              '''        state = "INIT";
        stopped = false;
        evaluateScheduled = false;''',
              '''        state = "INIT";
        stopped = false;
        paused = false;
        pauseStartedAt = null;
        totalPausedMs = 0;
        stateBeforePause = null;
        pendingPausedAction = null;
        evaluateScheduled = false;''',
              "restart pause reset"
          )

          text = replace_once(
              text,
              '''        stopped = true;
        cleanup();
        sendLocked = false;
        currentCycle = null;
        state = completedSuccessfully ? "DONE" : "STOPPED";''',
              '''        stopped = true;
        paused = false;
        pauseStartedAt = null;
        stateBeforePause = null;
        pendingPausedAction = null;
        cleanup();
        sendLocked = false;
        currentCycle = null;
        state = completedSuccessfully ? "DONE" : "STOPPED";''',
              "stop pause reset"
          )

          text = replace_once(
              text,
              '''        stopped = true;
        cleanup();
        sendLocked = false;
        currentCycle = null;
        state = "ERROR";''',
              '''        stopped = true;
        paused = false;
        pauseStartedAt = null;
        stateBeforePause = null;
        pendingPausedAction = null;
        cleanup();
        sendLocked = false;
        currentCycle = null;
        state = "ERROR";''',
              "fail pause reset"
          )

          text = replace_once(
              text,
              '''            stopped ||
            !pendingAutoSend ||''',
              '''            stopped ||
            paused ||
            !pendingAutoSend ||''',
              "pending resume pause guard"
          )

          text = replace_once(
              text,
              '''        if (stopped || sendLocked) {
            return false;
        }''',
              '''        if (stopped || paused || sendLocked) {
            return false;
        }''',
              "send pause guard"
          )

          text = replace_once(
              text,
              '''        if (stopped) {
            return false;
        }

        if (handoffInProgress) {''',
              '''        if (stopped || paused) {
            return false;
        }

        if (handoffInProgress) {''',
              "handoff pause guard"
          )

          text = replace_timer_before(
              text,
              "function handleTerminalResponseWithoutAssistant",
              "sendPrompt(\n                dueInjection.text",
              "terminal-injection"
          )
          complete_section = "function completeCycle"
          text = replace_timer_before(
              text,
              complete_section,
              "sendPrompt(\n                    dueInjection.text",
              "due-injection"
          )
          text = replace_timer_before(
              text,
              complete_section,
              "performChatHandoff(\n                    handoff.nextChatPrompt",
              "handoff"
          )
          text = replace_timer_before(
              text,
              complete_section,
              "resumePendingAutoSend(\n                    false",
              "pending-first"
          )
          text = replace_timer_before(
              text,
              complete_section,
              "sendPrompt(\n                CONFIG.REGULAR_PROMPT",
              "continuation"
          )

          text = replace_once(
              text,
              '''            stopped ||
            immediateSendLocked ||
            !currentCycle''',
              '''            stopped ||
            paused ||
            immediateSendLocked ||
            !currentCycle''',
              "evaluate pause guard"
          )

          text = replace_once(
              text,
              '''        if (stopped || evaluateScheduled) {
            return;
        }''',
              '''        if (stopped || paused || evaluateScheduled) {
            return;
        }''',
              "schedule pause guard"
          )

          text = replace_once(
              text,
              '''            evaluateScheduled = false;

            if (
                !currentCycle &&''',
              '''            evaluateScheduled = false;

            if (paused || stopped) {
                return;
            }

            if (
                !currentCycle &&''',
              "scheduled evaluation pause guard"
          )

          text = replace_once(
              text,
              '''                stateName: state,
                stopped,
                sendLocked,''',
              '''                stateName: state,
                stopped,
                paused,
                pauseStartedAt,
                totalPausedMs,
                stateBeforePause,
                pendingPausedAction: pendingPausedAction
                    ? {
                          label: pendingPausedAction.label,
                          deferredAt: pendingPausedAction.deferredAt
                      }
                    : null,
                sendLocked,''',
              "diagnostic pause state"
          )

          text = replace_once(
              text,
              '''                state,
                stopped,
                sendLocked,''',
              '''                state,
                stopped,
                paused,
                pauseStartedAt,
                totalPausedMs,
                stateBeforePause,
                pendingPausedAction: pendingPausedAction
                    ? {
                          label: pendingPausedAction.label,
                          deferredAt: pendingPausedAction.deferredAt
                      }
                    : null,
                sendLocked,''',
              "public pause state"
          )

          text = replace_once(
              text,
              '''                    runtimeMs:
                        runnerStartedAt == null
                            ? 0
                            : Date.now() -
                              runnerStartedAt,''',
              '''                    runtimeMs:
                        getRunnerRuntimeMs(),
                    paused,''',
              "metrics pause state"
          )

          text = replace_once(
              text,
              '''        version: VERSION,
        stop,
        createDiagnosticSnapshot,''',
              '''        version: VERSION,
        stop,
        pauseRun,
        resumeRun,
        createDiagnosticSnapshot,''',
              "public pause api"
          )

          path.write_text(text, encoding="utf-8")

          split_test = Path("tests/e2e/split-nudge.spec.js")
          split_text = split_test.read_text(encoding="utf-8")
          split_text = replace_once(split_text, 'expect(config.delay).toBe("10");', 'expect(config.delay).toBe("15");', "split test default")
          split_text = replace_once(split_text, 'test("five-minute wake does not restart the ten-minute split clock"', 'test("five-minute wake does not restart the fifteen-minute split clock"', "split test title")
          split_text = replace_once(split_text, 'await advanceClock(harness, 10 * 60 * 1000 + 1000);', 'await advanceClock(harness, 15 * 60 * 1000 + 1000);', "split test timing")
          split_test.write_text(split_text, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = replace_once(readme_text, 'Wake defaults to 10 minutes and split defaults to 10 minutes;', 'Wake defaults to 10 minutes and split defaults to 15 minutes;', "readme defaults")
          readme_text = replace_once(readme_text, 'Omitted wake values use the 10-minute default; omitted split values use the 10-minute default.', 'Omitted wake values use the 10-minute default; omitted split values use the 15-minute default.', "readme api defaults")
          readme_text = replace_once(readme_text, 'A second independently configurable long-work split escalation defaults to 10 minutes (range 1–20).', 'A second independently configurable long-work split escalation defaults to 15 minutes (range 1–20).', "readme split details")
          reliability_anchor = '- A watchdog wakes the state machine if a DOM mutation is missed; it does not independently decide to send.\n'
          readme_text = replace_once(
              readme_text,
              reliability_anchor,
              reliability_anchor + '- **Pause** freezes only Sequence Runner automation. It never clicks ChatGPT Stop and does not interrupt an Assistant response already in progress. While paused, automatic continuation, wake, split, Retry and handoff evaluation are suspended; the active cycle, counters, queued messages and pending post-response action are preserved. Resume continues the same run exactly once, and paused wall-clock time is excluded from wake/split timing.\n',
              "readme pause reliability"
          )
          debug_anchor = '''Manual stop:

```js
__sequenceRunner.stop()
```
'''
          debug_replacement = '''Pause/resume the current run without stopping ChatGPT:

```js
__sequenceRunner.pauseRun()
__sequenceRunner.resumeRun()
```

Manual final stop:

```js
__sequenceRunner.stop()
```
'''
          readme_text = replace_once(readme_text, debug_anchor, debug_replacement, "readme pause api")
          control_anchor = '### Start a fresh run\n'
          pause_section = '''### Pause and resume

While a run is active, **השהה ריצה** pauses the Sequence Runner loop only. It does not click ChatGPT Stop and does not cancel the response currently being generated. The button changes to **המשך ריצה**; resuming continues the same tracked run rather than starting over. Wake/split elapsed time is frozen for the duration of the pause.

'''
          readme_text = replace_once(readme_text, control_anchor, pause_section + control_anchor, "readme pause section")
          readme.write_text(readme_text, encoding="utf-8")

          agents = Path("AGENTS.md")
          agents_text = agents.read_text(encoding="utf-8")
          agents_text = replace_once(agents_text, 'The split delay is independently configurable from 1–20 minutes (default 10).', 'The split delay is independently configurable from 1–20 minutes (default 15).', "agents split invariant")
          agents_text = replace_once(agents_text, 'Its delay is independently configurable from 1–20 minutes and defaults to 10.', 'Its delay is independently configurable from 1–20 minutes and defaults to 15.', "agents split detail")
          long_running_anchor = 'Do not implement automatic resend loops. Manual stop remains the safe escape hatch if a run is genuinely stuck.\n'
          agents_text = replace_once(
              agents_text,
              long_running_anchor,
              'Pause is a distinct non-terminal runner state. It must never click ChatGPT Stop or discard the current cycle. While paused, automatic state-machine advancement and automatic sends are suspended, any already-scheduled post-response action must be preserved for resume, and paused wall-clock duration must not count toward wake/split thresholds. Resume continues the same run rather than creating a fresh run.\n\n' + long_running_anchor,
              "agents pause invariant"
          )
          agents.write_text(agents_text, encoding="utf-8")

          pause_test = r'''import { test, expect } from "./fixture.js";

async function waitForTrackedGeneration(harness) {
  await expect.poll(
    () => harness.page.evaluate(() => {
      const state = window.__sequenceRunner.getState();
      return !!state.currentCycle?.turnKey && !!document.querySelector('button[aria-label="Stop"]');
    })
  ).toBeTruthy();
}

test("panel exposes fifteen-minute split default and pause control", async ({ harness }) => {
  await harness.load();

  await expect(harness.page.locator('[data-input="split-after-minutes"]')).toHaveValue("15");
  await expect(harness.page.locator('[data-action="toggle-pause"]')).toBeHidden();

  const state = await harness.runnerState();
  expect(state.longWaitSplit.afterMinutes).toBe(15);
  expect(state.paused).toBe(false);
});

test("pause does not stop an active ChatGPT response and resume continues the same run", async ({ harness }) => {
  await harness.load();
  await harness.setScenario({
    responses: [
      { type: "normal", text: "Checkpoint complete.", startDelayMs: 20, finishDelayMs: 250 },
      { type: "normal", text: "סיימתי", startDelayMs: 20, finishDelayMs: 40 }
    ]
  });

  await harness.page.evaluate(() => window.__sequenceRunner.startExistingContext());
  await harness.waitForSentCount(1);
  await harness.waitForState("GENERATING");

  await harness.page.click('[data-action="toggle-pause"]');
  await expect.poll(() => harness.page.evaluate(() => window.__sequenceRunner.getState().paused)).toBe(true);
  await expect(harness.page.locator('[data-action="toggle-pause"]')).toHaveText("▶ המשך ריצה");

  await harness.page.waitForTimeout(450);
  expect(await harness.sentMessages()).toHaveLength(1);

  const eventsWhilePaused = await harness.events();
  expect(eventsWhilePaused.some((event) => event.type === "stop-click")).toBeFalsy();

  await harness.page.click('[data-action="toggle-pause"]');
  await harness.waitForSentCount(2);
  await harness.waitForState("DONE");

  const log = await harness.page.evaluate(() => window.__sequenceRunner.getLog());
  expect(log.some((entry) => entry.event === "runner-paused")).toBeTruthy();
  expect(log.some((entry) => entry.event === "runner-resumed")).toBeTruthy();
});

test("pause preserves a continuation already scheduled after response completion", async ({ harness }) => {
  await harness.loadCanonical();
  await harness.setScenario({
    responses: [
      { type: "normal", text: "Checkpoint complete." },
      { type: "normal", text: "סיימתי" }
    ]
  });

  await harness.page.evaluate(() => window.__sequenceRunner.startExistingContext());
  await harness.waitForSentCount(1);
  await harness.waitForState("READY_TO_CONTINUE", 3500);
  await harness.page.evaluate(() => window.__sequenceRunner.pauseRun());

  await harness.page.waitForTimeout(500);
  expect(await harness.sentMessages()).toHaveLength(1);

  const pausedState = await harness.runnerState();
  expect(pausedState.paused).toBe(true);
  expect(pausedState.pendingPausedAction?.label).toBe("continuation");

  await harness.page.evaluate(() => window.__sequenceRunner.resumeRun());
  await harness.waitForSentCount(2);
  await harness.waitForState("DONE", 3500);

  const log = await harness.page.evaluate(() => window.__sequenceRunner.getLog());
  expect(log.some((entry) => entry.event === "pause-action-deferred" && entry.label === "continuation")).toBeTruthy();
  expect(log.some((entry) => entry.event === "pause-action-resumed" && entry.label === "continuation")).toBeTruthy();
});

test("paused wall-clock time does not advance wake or split thresholds", async ({ harness }) => {
  await harness.load();
  await harness.page.evaluate(() => {
    const realDateNow = Date.now.bind(Date);
    window.__pauseClockOffsetMs = 0;
    Date.now = () => realDateNow() + window.__pauseClockOffsetMs;
  });
  await harness.setScenario({
    responses: [
      { type: "hold" },
      { type: "normal", text: "סיימתי" }
    ]
  });

  await harness.page.evaluate(() =>
    window.__sequenceRunner.startExistingContext(
      "steady",
      "autonomous",
      false,
      10,
      undefined,
      15
    )
  );
  await waitForTrackedGeneration(harness);

  await harness.page.evaluate(() => {
    window.__pauseClockOffsetMs = 9 * 60 * 1000;
  });
  await harness.page.waitForTimeout(80);
  await harness.page.evaluate(() => window.__sequenceRunner.pauseRun());

  await harness.page.evaluate(() => {
    window.__pauseClockOffsetMs = 30 * 60 * 1000;
  });
  await harness.page.waitForTimeout(120);
  expect(await harness.sentMessages()).toHaveLength(1);

  await harness.page.evaluate(() => window.__sequenceRunner.resumeRun());
  await harness.page.waitForTimeout(120);
  expect(await harness.sentMessages()).toHaveLength(1);

  await harness.page.evaluate(() => {
    window.__pauseClockOffsetMs = 31 * 60 * 1000 + 1000;
  });
