name: Apply work segmentation prompt update

on:
  push:
    branches:
      - feature/configurable-work-splitting-nudge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/configurable-work-splitting-nudge

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply prompt patch
        run: node scripts/patch-work-segmentation-prompt.mjs

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run regression suite
        run: npm test

      - name: Remove temporary prompt patch machinery
        run: |
          rm scripts/patch-work-segmentation-prompt.mjs
          rm .github/workflows/apply-work-segmentation-prompt.yml

      - name: Commit prompt update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Strengthen one-response work segmentation contract"
          git push origin HEAD:feature/configurable-work-splitting-nudge
