name: Apply work segmentation prompt update

on:
  push:
    branches:
      - feature/configurable-work-splitting-nudge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/configurable-work-splitting-nudge

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply prompt patch
        run: |
          node scripts/patch-work-segmentation-prompt.mjs
          node scripts/patch-work-segmentation-extra-tests.mjs

      - name: Build bookmarklet
        run: npm run build:bookmarklet

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee prompt-test-output.log

      - name: Upload prompt regression failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-segmentation-prompt-failure
          path: |
            prompt-test-output.log
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove temporary prompt patch machinery
        run: |
          rm scripts/patch-work-segmentation-prompt.mjs
          rm scripts/patch-work-segmentation-extra-tests.mjs
          rm .github/workflows/apply-work-segmentation-prompt.yml
          rm -f prompt-test-output.log

      - name: Commit prompt update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Strengthen one-response work segmentation contract"
          git push origin HEAD:feature/configurable-work-splitting-nudge
