name: Apply stopped-thinking hotfix

on:
  push:
    branches:
      - fix/stopped-thinking-terminal-turn
    paths:
      - scripts/apply-stopped-thinking-fix.mjs
      - .github/workflows/apply-stopped-thinking-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/stopped-thinking-terminal-turn
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic source patch
        run: node scripts/apply-stopped-thinking-fix.mjs

      - name: Validate readable source syntax
        run: node --check runner.js

      - name: Generate bookmarklet payload
        run: npx --yes terser@5.44.0 runner.js --compress --mangle --output /tmp/runner.min.payload.js

      - name: Build and validate bookmarklet
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const payload = fs.readFileSync('/tmp/runner.min.payload.js', 'utf8').replace(/\r?\n/g, '');
          const output = 'javascript:' + payload;
          if (!output.startsWith('javascript:')) throw new Error('Missing javascript: prefix');
          if (output.includes('\n') || output.includes('\r')) throw new Error('Bookmarklet must be exactly one physical line');
          if (!output.includes('3.18')) throw new Error('Bookmarklet does not contain v3.18');
          fs.writeFileSync('runner.min.js', output);
          fs.writeFileSync('/tmp/runner.min.check.js', payload);
          NODE
          node --check /tmp/runner.min.check.js

      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.js runner.min.js README.md AGENTS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Handle stopped thinking terminal turns"
          git push origin HEAD:fix/stopped-thinking-terminal-turn
