name: Finalize E2E docs

on:
  push:
    branches:
      - test/mock-chatgpt-e2e-suite

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/mock-chatgpt-e2e-suite

      - name: Add permanent regression instructions
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if '## Regression testing' not in text:
              text += '''\n\n## Regression testing\n\nThe repository includes a deterministic Mock ChatGPT + Playwright regression laboratory that executes the real canonical `runner.js` in Chrome.\n\nRun the complete release/change gate with:\n\n```bash\nnpm test\n```\n\nUseful narrower commands:\n\n```bash\nnpm run test:e2e\nnpm run check:bookmarklet\nnpm run mock\n```\n\n`npm run mock` opens the local Mock ChatGPT laboratory for interactive reproduction. The permanent CI workflow runs the regression suite for pull requests and `main`, and keeps Playwright trace/screenshot evidence on failures.\n\nFor reproducible bugs, prefer the permanent workflow: first create a failing Mock ChatGPT scenario, then fix `runner.js`, then keep the green test as regression coverage. See `tests/README.md` for architecture, scenarios and maintenance rules.\n\nThe mock protects behavior against the verified DOM contract; it does not replace occasional verification against the live ChatGPT DOM when selectors change.\n'''
              readme.write_text(text, encoding='utf-8')

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          if '## Regression-test contract' not in text:
              text += '''\n\n## Regression-test contract\n\nThe repository contains a deterministic Mock ChatGPT + Playwright E2E suite under `tests/`. It runs the real `runner.js`; production runner logic must never be replaced with a test double.\n\nBefore merging a behavior change, run `npm test`. This command also verifies that `runner.min.js` is exactly the bookmarklet generated from the canonical source, including the required bookmarklet transport decoding invariant.\n\nWhen a production bug can be reproduced deterministically, add the failing scenario/test before or together with the fix and keep it permanently as regression coverage. Do not weaken production behavior merely to satisfy the fixture. If the fixture differs from a verified live ChatGPT DOM behavior, fix the fixture.\n\nKeep Mock ChatGPT's production-facing locators aligned with verified selectors in this document. The deterministic mock cannot detect live-site selector drift by itself, so selector changes still require a real DOM probe.\n\nUse `tests/README.md` for the test architecture and local commands.\n'''
              agents.write_text(text, encoding='utf-8')
          PY

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md
          git diff --cached --quiet || git commit -m "Document permanent regression-test contract"
          git push
